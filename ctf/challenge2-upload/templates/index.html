<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tableau de bord - Greffons</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:40px; }
    .box { background:white; max-width:560px; margin:0 auto; padding:30px 40px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
    h1 { font-size:20px; }
    ul { padding-left:18px; }
    form { margin-top:16px; }
    button { padding:8px 16px; background:#2f5496; color:white; border:none; border-radius:4px; cursor:pointer; }
    select, input[type=file] { margin-bottom:10px; }
    .output { background:#263238; color:#c8e6c9; padding:12px; border-radius:4px; margin-top:16px; font-family:monospace; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Gestion des greffons du tableau de bord</h1>

    <p>Greffons actuellement deposes :</p>
    <ul>
      {% for p in plugins %}<li>{{ p }}</li>{% else %}<li><em>aucun</em></li>{% endfor %}
    </ul>

    <form method="post" action="/upload" enctype="multipart/form-data">
      <p>Deposer un nouveau greffon (.py) :</p>
      <input type="file" name="plugin">
      <br><button type="submit">Deposer</button>
    </form>

    <form method="post" action="/run">
      <p>Executer un greffon depose :</p>
      <select name="plugin">
        {% for p in plugins %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
      </select>
      <br><button type="submit">Executer</button>
    </form>

    {% if output %}<div class="output">{{ output }}</div>{% endif %}
  </div>
</body>
</html>
