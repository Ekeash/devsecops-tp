<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Outil reseau - Ping</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:40px; }
    .box { background:white; max-width:560px; margin:0 auto; padding:30px 40px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
    h1 { font-size:20px; }
    input { width:100%; padding:8px; margin-bottom:12px; box-sizing:border-box; }
    button { padding:8px 16px; background:#2f5496; color:white; border:none; border-radius:4px; cursor:pointer; }
    pre { background:#263238; color:#c8e6c9; padding:12px; border-radius:4px; overflow-x:auto; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Outil reseau - Test de connectivite</h1>
    <form method="post" action="/ping">
      <input type="text" name="host" placeholder="Adresse a tester (ex: 127.0.0.1)" value="{{ host }}">
      <button type="submit">Tester</button>
    </form>
    {% if output %}<pre>{{ output }}</pre>{% endif %}
  </div>
</body>
</html>
