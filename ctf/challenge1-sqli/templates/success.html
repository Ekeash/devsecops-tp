<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Intranet - Bienvenue</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; display:flex; justify-content:center; margin-top:80px; }
    .box { background:white; padding:30px 40px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); width:420px; }
    .flag { background:#e8f5e9; border:1px solid #66bb6a; padding:12px; border-radius:4px; font-family:monospace; margin-top:16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bienvenue, {{ user }}</h1>
    {% if flag %}
      <p>Message confidentiel de l'administrateur :</p>
      <div class="flag">{{ flag }}</div>
    {% else %}
      <p>Connexion reussie, mais ce compte n'a pas de privileges administrateur.</p>
    {% endif %}
  </div>
</body>
</html>
